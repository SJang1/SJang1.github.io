<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인 자기소개 홈페이지</title>
  <style>
    /* 기본 리셋 */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #f9f9f9;
      color: #333;
      line-height: 1.6;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    /* 네비게이션 */
    nav {
      background: #f0f8ff;
      padding: 10px;
      text-align: center;
      margin-bottom: 40px;
    }
    nav a {
      margin: 0 15px;
      color: #333;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #007acc;
    }
    /* 프로필 섹션 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    .profile {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      cursor: pointer;
    }
    .profile img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }
    .profile:hover img {
      transform: scale(1.1);
    }
    .intro {
      display: none;
      margin-top: 20px;
      text-align: center;
      font-size: 1.2em;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .intro.active {
      display: block;
      opacity: 1;
    }
    /* 포트폴리오 섹션 */
    .portfolio {
      margin-bottom: 40px;
    }
    .portfolio h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .portfolio-item {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .portfolio-item:hover {
      transform: translateY(-5px);
    }
    .portfolio-item img {
      width: 100%;
      border-radius: 8px;
    }
    .portfolio-item h3 {
      text-align: center;
      margin-top: 10px;
    }
    /* 연락처 섹션 */
    .contact {
      text-align: center;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    /* 스무스 스크롤 */
    html {
      scroll-behavior: smooth;
    }
    /* 반응형 디자인 */
    @media(max-width: 768px) {
      .container {
        width: 95%;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 네비게이션 -->
  <nav>
    <a href="#profile-section">프로필</a>
    <a href="#portfolio-section">포트폴리오</a>
    <a href="#contact-section">연락처</a>
  </nav>
  <div class="container">
    <!-- 프로필 및 자기소개 섹션 -->
    <header id="profile-section">
      <div class="profile" id="profile">
        <img src="29011440.jpg" alt="프로필 이미지">
      </div>
      <div class="intro" id="intro">
        <p>안녕하세요, 김세진입니다.<br>주로 백엔드랑 인프라를 하는 개발자로서 멋진 인터넷 세상을 주도하고 있습니다.</p>
      </div>
    </header>
    <!-- 포트폴리오 섹션 -->
    <section class="portfolio" id="portfolio-section">
      <h2>포트폴리오</h2>
      <div class="portfolio-grid">
        <div class="portfolio-item">
          <a href="https://webwizard.life" target="_blank">
            <img src="webwizard_logo.png" alt="WebWizard 동아리 로고">
          </a>
            <h3>WebWizard 동아리 회장 활동</h3>
        </div>
        <div class="portfolio-item">
          <img src="NO_IMAGE.png" alt="프로젝트 2">
          <h3>kick-yoon 웹사이트 개발</h3>
        </div>
        <div class="portfolio-item">
          <img src="whitehat.jpg" alt="프로젝트 3">
          <h3>화이트햇 투게더 3등상 수상</h3>
        </div>
        <div class="portfolio-item">
          <img src="mastodon.jpg" alt="프로젝트 4">
          <h3>페디버스 서버 운영</h3>
        </div>
      </div>
    </section>
    <!-- 연락처 섹션 -->
    <section class="contact" id="contact-section">
      <h2>연락처</h2>
      <p>siliconsjang@gmail.com</p>
      <p>+82 10 5136 8286</p>
    </section>
  </div>
  <script>
    // 프로필 이미지 클릭 시 자기소개 토글
    document.getElementById("profile").addEventListener("click", function() {
      var intro = document.getElementById("intro");
      intro.classList.toggle("active");
    });
  </script>
</body>
</html>
